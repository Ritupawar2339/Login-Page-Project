<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f1419;
      --surface: #1a2332;
      --surface-hover: #222d3f;
      --border: #2d3a4f;
      --text: #e8eef6;
      --text-muted: #8b9cb3;
      --accent: #3d8bfd;
      --accent-hover: #5ca0ff;
      --danger: #f87171;
      --radius: 12px;
      --shadow: 0 24px 48px rgba(0, 0, 0, 0.35);
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "DM Sans", system-ui, sans-serif;
      font-size: 16px;
      line-height: 1.5;
      color: var(--text);
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 120% 80% at 50% -20%, rgba(61, 139, 253, 0.22), transparent),
        radial-gradient(ellipse 80% 60% at 100% 100%, rgba(61, 139, 253, 0.08), transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-wrap {
      width: 100%;
      max-width: 420px;
    }

    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 36px;
      box-shadow: var(--shadow);
    }

    .login-brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-brand h1 {
      margin: 0 0 8px;
      font-size: 1.5rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .login-brand p {
      margin: 0;
      font-size: 0.9375rem;
      color: var(--text-muted);
    }

    .field {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.8125rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    input[type="email"],
    input[type="password"] {
      width: 100%;
      padding: 12px 14px;
      font-family: inherit;
      font-size: 1rem;
      color: var(--text);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
    }

    input[type="email"]::placeholder,
    input[type="password"]::placeholder {
      color: var(--text-muted);
      opacity: 0.7;
    }

    input[type="email"]:hover,
    input[type="password"]:hover {
      border-color: #3d4d66;
    }

    input[type="email"]:focus,
    input[type="password"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(61, 139, 253, 0.22);
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 24px;
    }

    .remember {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--text-muted);
      user-select: none;
    }

    .remember input {
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .forgot {
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--accent);
      text-decoration: none;
      transition: color 0.15s;
    }

    .forgot:hover {
      color: var(--accent-hover);
    }

    .forgot:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    button[type="submit"] {
      width: 100%;
      padding: 14px 20px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(180deg, var(--accent) 0%, #2566cc 100%);
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.12s, box-shadow 0.15s, filter 0.15s;
    }

    button[type="submit"]:hover {
      filter: brightness(1.06);
      box-shadow: 0 8px 24px rgba(61, 139, 253, 0.35);
    }

    button[type="submit"]:active {
      transform: scale(0.99);
    }

    button[type="submit"]:focus-visible {
      outline: 2px solid var(--accent-hover);
      outline-offset: 3px;
    }

    .signup {
      text-align: center;
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      font-size: 0.9375rem;
      color: var(--text-muted);
    }

    .signup a {
      color: var(--accent);
      font-weight: 600;
      text-decoration: none;
    }

    .signup a:hover {
      color: var(--accent-hover);
    }

    .signup a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 4px;
    }

    @media (max-width: 420px) {
      .login-card {
        padding: 28px 22px;
      }
    }
  </style>
</head>
<body>
  <div class="login-wrap">
    <main class="login-card" aria-labelledby="login-title">
      <header class="login-brand">
        <h1 id="login-title">Welcome back</h1>
        <p>Sign in to continue</p>
      </header>

      <form action="#" method="post" autocomplete="on">
        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@example.com"
            required
            autocomplete="email"
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input
            type="password"
            id="password"
            name="password"
            placeholder="••••••••"
            required
            autocomplete="current-password"
          >
        </div>

        <div class="row">
          <label class="remember">
            <input type="checkbox" name="remember" value="1">
            Remember me
          </label>
          <a class="forgot" href="#">Forgot password?</a>
        </div>

        <button type="submit">Sign in</button>
      </form>

      <p class="signup">
        Don't have an account? <a href="#">Create one</a>
      </p>
    </main>
  </div>
</body>
</html>
